# Scheduled refresh: runs the ingestion pipeline on GitHub Actions and commits
# the resulting store snapshot to this repo. Because this repository is
# connected to Vercel, each pushed snapshot triggers an automatic redeploy with
# fresh data baked in — the serverless app then hydrates from it on cold start.
# (Zero external services; swap in Supabase for a true multi-writer production
# database — see README "Data & storage".)
name: refresh
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ingest + cleanup + briefing -> data/runtime snapshot
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: npm run ingest
      - name: Commit the store snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit"
          else
            git commit -m "chore(data): scheduled refresh"
            git push || (git pull --rebase origin main && git push)
          fi
